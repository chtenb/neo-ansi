#"$schema" = "https://yazi-rs.github.io/schemas/theme.json"

[flavor]
dark  = ""
light = ""

[mgr]
cwd = { fg = "cyan" }

# Hovered
hovered         = { reversed = true }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "yellow", bold = true, italic = true, underline = true }
find_position = { fg = "magenta", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "lightgreen",  bg = "lightgreen" }
marker_cut      = { fg = "lightred",    bg = "lightred" }
marker_marked   = { fg = "lightcyan",   bg = "lightcyan" }
marker_selected = { fg = "lightyellow", bg = "lightyellow" }

# Count
count_copied   = { fg = "white", bg = "green" }
count_cut      = { fg = "white", bg = "red" }
count_selected = { fg = "white", bg = "yellow" }

# Border
border_symbol = "│"
border_style  = { fg = "gray" }

# Highlighting
syntect_theme = ""

[tabs]
active   = { reversed = true }
inactive = {}

[mode]
normal_main = { fg = "250", bg = "236", bold = true }
normal_alt  = { fg = "236", bg = "250" }

# Select mode
select_main = { fg = "236", bg = "red", bold = true }
select_alt  = { fg = "236", bg = "250" }

# Unset mode
unset_main = { fg = "236", bg = "red", bold = true }
unset_alt  = { fg = "236", bg = "250" }

[status]
separator_open  = ""
separator_close = ""

overall = { fg = "250", bg = "232" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "blue", bg = "234" }
progress_error  = { fg = "red", bg = "234" }

# Permissions
perm_sep   = { fg = "darkgray" }
perm_type  = { fg = "green" }
perm_read  = { fg = "yellow" }
perm_write = { fg = "red" }
perm_exec  = { fg = "cyan" }

[pick]
border   = { fg = "blue" }
active   = { fg = "magenta", bold = true }
inactive = {}

[input]
border   = { fg = "blue" }
title    = {}
value    = {}
selected = { reversed = true }

[confirm]
border     = { fg = "blue" }
title      = { fg = "blue" }
content    = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[cmp]
border   = { fg = "blue" }
active   = { reversed = true }
inactive = {}

[tasks]
border  = { fg = "blue" }
title   = {}
hovered = { fg = "magenta", underline = true }

[which]
cols            = 3
mask            = { bg = "234" }
cand            = { fg = "lightcyan" }
rest            = { fg = "darkgray" }
desc            = { fg = "lightmagenta" }
separator       = "  "
separator_style = { fg = "darkgray" }

[help]
on      = { fg = "cyan" }
run     = { fg = "magenta" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "234", bg = "250" }

[spot]
border   = { fg = "blue" }
title    = { fg = "blue" }
tbl_col  = { fg = "gray" }
tbl_cell = {}

[notify]
title_info  = { fg = "green" }
title_warn  = { fg = "yellow" }
title_error = { fg = "red" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "yellow" },

	# Media
	{ mime = "{audio,video}/*", fg = "magenta" },

	# Archives
	{ mime = "application/{,g}zip", fg = "red" },
	{ mime = "application/{tar,bzip*,7z*,xz,rar}", fg = "red" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "cyan" },

	# Empty files
	{ mime = "inode/empty", fg = "gray" },

	# Special files
	{ url = "*", is = "orphan", fg = "red", reversed = true },
	{ url = "*", is = "exec"  , fg = "green" },

	# Dummy files
	{ url = "*", is = "dummy", fg = "red", reversed = true },
	{ url = "*/", is = "dummy", fg = "red", reversed = true },

	# Fallback
	# { url = "*", fg = "white" },
	{ url = "*/", fg = "blue" }
]

# : }}}

[icon]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "blue" },
	{ if = "link", text = "", fg = "blue" },
	{ if = "block", text = "", fg = "blue" },
	{ if = "char", text = "", fg = "blue" },
	{ if = "fifo", text = "", fg = "blue" },
	{ if = "sock", text = "", fg = "blue" },
	{ if = "sticky", text = "", fg = "blue" },
	{ if = "dummy", text = "", fg = "blue" },

	# Fallback
	{ if = "dir", text = "", fg = "gray" },
	{ if = "exec", text = "", fg = "green" },
	{ if = "!dir", text = "", fg = "gray" },
]
