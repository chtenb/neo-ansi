# | Helix name    | ANSI index | Usual terminal name          |
# |---------------|------------|------------------------------|
# | black         | 0          | black                        |
# | red           | 1          | red                          |
# | green         | 2          | green                        |
# | yellow        | 3          | yellow                       |
# | blue          | 4          | blue                         |
# | magenta       | 5          | magenta                      |
# | cyan          | 6          | cyan                         |
# | light-gray    | 7          | white                        |
# | gray          | 8          | bright black                 |
# | light-red     | 9          | bright red                   |
# | light-green   | 10         | bright green                 |
# | light-yellow  | 11         | bright yellow                |
# | light-blue    | 12         | bright blue                  |
# | light-magenta | 13         | bright magenta               |
# | light-cyan    | 14         | bright cyan                  |
# | white         | 15         | bright white                 |
# | default       | none       | the terminal's default fg/bg |

"attribute" = "yellow"
"type" = "yellow"
"type.builtin" = "red"
#"type.enum" = "default"
#"type.enum.variant" = "default"
"constructor" = "light-blue"
"constant" = "light-red"
# "constant.builtin" = "default"
# "constant.builtin.boolean" = "default"
# "constant.character" = "default"
# "constant.character.escape" = "default"
# "constant.numeric" = "default"
# "constant.numeric.integer" = "default"
# "constant.numeric.float" = "default"
"string" = "green"
"string.regexp" = "cyan"
"string.special" = "cyan"
# "string.special.path" = "default"
# "string.special.url" = "default"
# "string.special.symbol" = "default"
"comment" = { fg = "gray", modifiers = ["dim"] }
# "comment.line" = "default"
# "comment.block" = "default"
# "comment.block.documentation" = "default"
"variable" = "default"
"variable.builtin" = "light-blue"
# "variable.parameter" = "default"
"variable.other" = "white"
"variable.other.member" = "light-yellow"
"label" = "white"
"punctuation" = "light-cyan"
# "punctuation.delimiter" = "default"
# "punctuation.bracket" = "default"
# "punctuation.special" = "default"
"keyword" = { fg = "magenta", modifiers = ["bold"] }
# "keyword.control" = "default"
# "keyword.control.conditional" = "default"
# "keyword.control.repeat" = "default"
# "keyword.control.import" = "default"
# "keyword.control.export" = "default"
# "keyword.control.return" = "default"
# "keyword.control.exception" = "default"
# "keyword.operator" = "default"
# "keyword.directive" = "default"
# "keyword.function" = "default"
# "keyword.storage" = "default"
# "keyword.storage.type" = "default"
# "keyword.storage.modifier" = "default"
"operator" = "blue"
"function" = "blue"
"function.builtin" = "light-blue"
# "function.method" = "default"
"function.macro" = "cyan"
"function.special" = "cyan"
"tag" = "red"
"tag.builtin" = { fg = "magenta", modifiers = ["bold"] }
"namespace" = "default"
"special" = "white"
#"markup" = "default"
"markup.heading" = { fg = "red", modifiers = [] }
"markup.heading.marker" = { fg = "light-red", modifiers = ["bold"] }
"markup.heading.1" = { fg = "red", modifiers = ["bold"] }
"markup.heading.2" = { fg = "magenta", modifiers = ["bold"] }
"markup.heading.3" = { fg = "blue", modifiers = ["bold"] }
"markup.heading.4" = { fg = "default", modifiers = ["bold"] }
"markup.heading.5" = { fg = "default", modifiers = [] }
"markup.heading.6" = { fg = "default", modifiers = [] }
"markup.list" = "light-yellow"
# "markup.list.unnumbered" = "default"
# "markup.list.numbered" = "default"
# "markup.list.checked" = "default"
# "markup.list.unchecked" = "default"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { fg = "gray", modifiers = ["crossed_out"] }
"markup.link" = "green"
"markup.link.url" = { fg = "green", underline.style="line" }
"markup.link.label" = "yellow"
"markup.link.text" = "yellow"
"markup.quote" = "cyan"
"markup.raw" = "blue"
